# Robot acting like another "human" sim agent
sim_human_robot:
  ros__parameters:
    agent_id: "robot"
    goal_property: "X"   # pick X/Y or make it adaptive in your policy
    server_base_url: "http://URL:8080"
    stt_topic: "/audio/stt_text"

    policy_type: "llm"
    llm_provider: "openai"
    llm_model: "gpt-4.1-mini"
    llm_temperature: 0.2
    llm_max_tokens: 250
    llm_top_k_boxes: 100
    llm_timeout_sec: 30.0

    humans_json: >
      [{"id":"human_a","name":"Sam"},{"id":"human_b","name":"Jacob"},{"id":"robot","name":"Bob"}]
    robots_json: >
      []

    trust_overrides_json: >
      {"human_a": 0.60, "human_b": 0.60}

    help_target_speaker: "human_a"  # or "human_b"
    decision_period_sec: 1.0
    speed_mps: 1.0
    dispose_threshold: 0.80
    giveup_threshold: 0.20
    help_wait_sec: 20.0
    dist_weight: 2.0
    log_actions: true

    risk_aversion: 0.7
    stubbornness: 0.5
    fairness_sensitivity: 0.3

