version: 1
meta:
  project: robot-perception
  units:
    latency_ms: "ms (mean/EMA)"
    throughput_fps: "frames/s at stated resolution"
    memory_mb: "approx resident"
  notes: "Tasks declare outputs; models implement task with metrics/params."
  # Optional: shared scalar types the rule engine understands
  value_types:
    - { name: "int",    description: "integer" }
    - { name: "float",  description: "floating point number" }
    - { name: "bool",   description: "boolean" }
    - { name: "string", description: "UTF-8 string" }
    - { name: "ts",     description: "UNIX timestamp (seconds as float)" }

tasks:

  odometry_tracking:
    description: "Track robot base pose for distance and rotation changes"
    node: ""   # Not required unless you dynamically enable something
    outputs:
      - id: "odom"
        ros:
          topic: "/odom"
          msg: "nav_msgs/Odometry"
        # Fields exposed to rules after decoding Odometry
        context:
          fields:
            - { name: x,        type: "float",  desc: "map/base_link x position (m)" }
            - { name: y,        type: "float",  desc: "map/base_link y position (m)" }
            - { name: yaw,      type: "float",  desc: "heading yaw in radians" }
            - { name: frame_id, type: "string", desc: "TF frame of pose ('map', etc.)" }
            - { name: ts,       type: "ts",     desc: "message timestamp" }

  object_detection:
    description: "2D objects; optionally your node adds 3D map poses via depth/TF."
    node: "/coco_detector"             # <— ROS node name that runs this task
    outputs:
      - id: detection.2d
        ros: { msg: vision_msgs/Detection2DArray, topic: "/detected_objects" }
        schema_hint: >
          {"detections":[{"cls":str,"score":float,
            "bbox":[float,float,float,float],
            "map_x":float?,"map_y":float?,"frame_id":str}]}
        context:
          per_detection_fields:
            - { name: cls,     type: "string", desc: "COCO class label (e.g. 'person')" }
            - { name: score,   type: "float",  desc: "detection confidence 0..1" }
            - { name: cx,      type: "float",  desc: "bbox center x (pixels)" }
            - { name: cy,      type: "float",  desc: "bbox center y (pixels)" }
            - { name: w,       type: "float",  desc: "bbox width (pixels)" }
            - { name: h,       type: "float",  desc: "bbox height (pixels)" }
            - { name: map_x,   type: "float?", desc: "3D x position in target_frame (if depth+TF OK)" }
            - { name: map_y,   type: "float?", desc: "3D y position in target_frame (if depth+TF OK)" }
            - { name: map_z,   type: "float?", desc: "3D z position in target_frame (if depth+TF OK)" }
            - { name: frame_id,type: "string", desc: "frame for 3D pose, usually 'map'" }
            
      - id: image.annotated
        ros: { msg: sensor_msgs/Image, topic: "/annotated_image" }
        # No scalar fields; normally not used directly in rules.
        context:
          fields: []

      - id: markers
        ros: { msg: visualization_msgs/MarkerArray, topic: "/visualization_marker_array" }
        context:
          fields: []

      - id: perf.json
        ros: { msg: std_msgs/String, topic: "/yolo_perf" }
        schema_hint: '{"latency_ms":{"det":float,"pose":float,"total":float},"fps_ema":float}'
        context:
          fields:
            - { name: lat_det_ms,   type: "float", desc: "detector latency (ms)" }
            - { name: lat_pose_ms,  type: "float", desc: "pose latency (ms, if used)" }
            - { name: lat_total_ms, type: "float", desc: "total pipeline latency (ms)" }
            - { name: fps_ema,      type: "float", desc: "EMA of detector FPS" }

    services:
      enable:                                # std_srvs/SetBool to gate inference
        name: "/toggle_yolo"
        type: "std_srvs/SetBool"
      set_model:                             # rcl_interfaces/SetParameters to switch weights
        param_service: "/coco_detector/set_parameters"
        param_name: "yolo_weights"
        type: "rcl_interfaces/SetParameters"
    models:
      - id: yolo11n
        version: "11n"
        description: "Nano detector (very low latency)."
        metrics:
          latency_ms: { det_mean: 8.0 }       # example at 640p
        resources: { device_pref: ["cuda","cpu"], memory_mb: 600, vram_mb: 500 }
        parameters:
          detection_threshold:
            type: "float"
            default: 0.30
          device:
            type: "string"
            default: "cuda"
            enum: ["cuda","cpu"]
          weights:
            type: "string"
            default: "yolo11n.pt"

      - id: yolo11x
        version: "11x"
        description: "High-accuracy detector."
        metrics:
          latency_ms: { det_mean: 22.0 }
          throughput_fps: { rgb_640: 30.0 }
          accuracy: { coco_map_50_95: 0.53 }
        resources: { device_pref: ["cuda","cpu"], memory_mb: 2600, vram_mb: 2400 }
        parameters:
          detection_threshold:
            type: "float"
            default: 0.25
          device:
            type: "string"
            default: "cuda"
            enum: ["cuda","cpu"]
          weights:
            type: "string"
            default: "yolo11x.pt"

  pose_detection:
    description: "Human keypoints (COCO-17), on-demand."
    node: "/coco_detector"              # same node publishes pose JSON
    outputs:
      - id: pose.json
        ros: { msg: std_msgs/String, topic: "/yolo_pose_json" }
        schema_hint: >
          {"persons":[{"bbox":[x1,y1,x2,y2],
                       "score":float,
                       "keypoints":[[x,y,conf],...]}]}
        context:
          per_person_fields:
            - { name: bbox,      type: "[float;4]", desc: "[x1,y1,x2,y2] pixels" }
            - { name: score,     type: "float?",    desc: "pose person score (if available)" }
            - { name: n_kpts,    type: "int",      desc: "number of keypoints" }
            - { name: kpts,      type: "list",     desc: "list of [x,y,conf]" }

      - id: image.annotated
        ros: { msg: sensor_msgs/Image, topic: "/annotated_image" }
        context:
          fields: []

      - id: perf.json
        ros: { msg: std_msgs/String, topic: "/yolo_perf" }
        schema_hint: '{"latency_ms":{"pose":float}}'
        context:
          fields:
            - { name: lat_pose_ms, type: "float", desc: "pose latency (ms)" }

    services:
      enable:
        name: "/toggle_yolo_pose"
        type: "std_srvs/SetBool"
      set_model:
        param_service: "/coco_detector/set_parameters"
        param_name: "yolo_pose_weights"
        type: "rcl_interfaces/SetParameters"

    models:
      - id: yolo11n-pose
        version: "11n-pose"
        metrics:
          latency_ms: { pose_mean: 14.0 }
          throughput_fps: { rgb_640: 55.0 }
          accuracy: { keypoint_AP_50_95: 0.50 }
        resources: { device_pref: ["cuda","cpu"], memory_mb: 800, vram_mb: 700 }
        parameters:
          device:
            type: "string"
            default: "cuda"
            enum: ["cuda","cpu"]
          weights:
            type: "string"
            default: "yolo11n-pose.pt"

      - id: yolo11x-pose
        version: "11x-pose"
        metrics:
          latency_ms: { pose_mean: 35.0 }
          throughput_fps: { rgb_640: 22.0 }
          accuracy: { keypoint_AP_50_95: 0.63 }
        resources: { device_pref: ["cuda","cpu"], memory_mb: 2800, vram_mb: 2500 }
        parameters:
          device:
            type: "string"
            default: "cuda"
            enum: ["cuda","cpu"]
          weights:
            type: "string"
            default: "yolo11x-pose.pt"

  audio_gating:
    description: "Low-latency gate; partial text and DoA summary per window."
    node: "/stt_angle"
    outputs:
      - id: text.partial
        ros: { msg: std_msgs/String, topic: "/audio/stt_partial_json" }
        schema_hint: >
          {"kind":"partial_gate","text":str,"avg_logprob":float,"lat_ms":float,
           "doa":{"angle_mode_deg":float,"angle_mean_deg":float}}
        context:
          fields:
            - { name: text,              type: "string", desc: "partial ASR text" }
            - { name: avg_logprob,       type: "float",  desc: "avg token logprob" }
            - { name: lat_ms,            type: "float",  desc: "window latency (ms)" }
            - { name: doa_angle_mode_deg,type: "float",  desc: "mode DoA (deg)" }
            - { name: doa_angle_mean_deg,type: "float",  desc: "mean DoA (deg)" }
            - { name: ts,                type: "ts",     desc: "message timestamp" }

      - id: perf.json
        ros: { msg: std_msgs/String, topic: "/stt_perf" }
        context:
          fields:
            - { name: lat_gate_ms_ema, type: "float?", desc: "EMA gate latency (ms)" }
            - { name: lat_asr_ms_ema,  type: "float?", desc: "EMA ASR latency (ms)" }
            - { name: lat_e2e_ms_ema,  type: "float?", desc: "EMA end-to-end latency (ms)" }
            - { name: windows_processed,      type: "int",    desc: "gate windows processed" }
            - { name: utterances_finalized,   type: "int",    desc: "final utterances emitted" }
            - { name: last_gate_lat_ms,       type: "float?", desc: "most recent gate window latency (ms)" }
            - { name: last_asr_lat_ms,        type: "float?", desc: "most recent ASR latency (ms)" }
            - { name: last_e2e_ms,            type: "float?", desc: "most recent end-to-end latency (ms)" }


    services:
      enable:
        name: "/toggle_gate"
        type: "std_srvs/SetBool"
      set_model:
        param_service: "/stt_angle/set_parameters"
        param_name: "wg_model_size"
        type: "rcl_interfaces/SetParameters"

    models:
      - id: whisper
        version: "large-v3"
        metrics: { latency_ms: { window_infer_mean: 25.0 } }
        resources: { device_pref: ["cuda","cpu"], memory_mb: 2200, vram_mb: 1600 }
        parameters:
          wg_window_ms:
            type: "int"
            default: 3000
          wg_hop_ms:
            type: "int"
            default: 1000

  audio_asr:
    description: "Final, higher-quality utterance transcription."
    node: "/stt_angle"
    outputs:
      - id: text.final
        ros: { msg: std_msgs/String, topic: "/audio/stt_text" }
        schema_hint: '{"text": str}'
        context:
          fields:
            - { name: text, type: "string", desc: "final ASR text" }

      - id: json.final
        ros: { msg: std_msgs/String, topic: "/audio/stt_doa_json" }
        schema_hint: >
          {"text":str,"azimuth_deg":float,"stamp":{"sec":int,"nanosec":int}}
        context:
          fields:
            - { name: text,        type: "string", desc: "final utterance transcript" }
            - { name: azimuth_deg, type: "float",  desc: "DoA for utterance (deg)" }
            - { name: language,    type: "string?",desc: "language code, e.g. 'en', may be null" }
            - { name: duration,    type: "float?", desc: "utterance duration in seconds (if set)" }
            - { name: ts,          type: "ts",     desc: "utterance end timestamp (derived from stamp)" }

      - id: perf.json
        kind: perf
        ros: { msg: std_msgs/String, topic: "/stt_perf" }
        context:
          fields:
            - { name: lat_gate_ms_ema, type: "float?", desc: "EMA gate latency (ms)" }
            - { name: lat_asr_ms_ema,  type: "float?", desc: "EMA ASR latency (ms)" }
            - { name: lat_e2e_ms_ema,  type: "float?", desc: "EMA end-to-end latency (ms)" }
            - { name: windows_processed,      type: "int",    desc: "gate windows processed" }
            - { name: utterances_finalized,   type: "int",    desc: "final utterances emitted" }
            - { name: last_gate_lat_ms,       type: "float?", desc: "most recent gate window latency (ms)" }
            - { name: last_asr_lat_ms,        type: "float?", desc: "most recent ASR latency (ms)" }
            - { name: last_e2e_ms,            type: "float?", desc: "most recent end-to-end latency (ms)" }

    services:
      enable:
        name: "/toggle_stt"
        type: "std_srvs/SetBool"
      set_model:
        param_service: "/stt_angle/set_parameters"
        param_name: "stt_model_size"
        type: "rcl_interfaces/SetParameters"

    models:
      - id: tiny
        version: "tiny"
        description: "Whisper tiny – lowest latency, lowest quality."
        metrics:
          latency_ms: { utter_infer_mean: 60.0 }   # ballpark, update from EMA later
        resources:
          device_pref: ["cuda","cpu"]
          memory_mb: 800
          vram_mb: 600

      - id: small
        version: "small"
        description: "Whisper small – balance between speed and quality."
        metrics:
          latency_ms: { utter_infer_mean: 120.0 }
        resources:
          device_pref: ["cuda","cpu"]
          memory_mb: 1600
          vram_mb: 1200

      - id: medium
        version: "medium"
        description: "Whisper medium – higher quality, higher latency."
        metrics:
          latency_ms: { utter_infer_mean: 160.0 }
        resources:
          device_pref: ["cuda","cpu"]
          memory_mb: 3200
          vram_mb: 2400

      - id: large-v3
        version: "large-v3"
        description: "Whisper large – top quality, top latency."
        metrics:
          latency_ms: { utter_infer_mean: 180.0 }
        resources:
          device_pref: ["cuda","cpu"]
          memory_mb: 2600
          vram_mb: 1800


  bt_proximity:
    description: "Raw Bluetooth RSSI readings for objects (no TF/DB)."
    node: ""   # no enable/disable service required for the event layer
    outputs:
      - id: "bt.reading"
        ros:
          topic: "/bt/readings"
          msg: "bt_msgs/BtReading"
        context:
          fields:
            - { name: rssi,        type: "int",    desc: "RSSI (dBm)" }
            - { name: object_id,   type: "string", desc: "object / CNode id" }
            - { name: device_id,   type: "string", desc: "BT device id" }
            - { name: phone_id,    type: "string", desc: "phone id (human/device)" }
            - { name: frame_id,    type: "string", desc: "TF frame of reading (should be 'map')" }
            - { name: ts,          type: "ts",     desc: "reading timestamp" }

  skill_status:
    description: "Skill execution status and completion events."
    node: ""   # no enable/disable; published directly by SkillsAgent
    outputs:
      - id: "skill.status"
        ros:
          topic: "/skills/status"
          msg: "std_msgs/String"
        # conceptual schema:
        # {"skill":str,"status":str,"reason":str,"step_idx":int,"ctx":{...}}
        context:
          fields:
            - { name: kind,       type: "string", desc: "event kind: skill_started, step_started, skill_finished" }
            - { name: skill,      type: "string", desc: "composite skill name" }
            - { name: step_idx,   type: "int",    desc: "current step index (0-based)" }
            - { name: started_ms, type: "int",    desc: "time skill was armed (ms since epoch)" }
            - { name: activated,  type: "bool",   desc: "whether composite-level when has fired" }
            - { name: done,       type: "bool",   desc: "true if skill has finished" }
            - { name: primitive,  type: "string", desc: "primitive name for this step (if applicable; may be null)" }
            - { name: composite,  type: "string", desc: "nested composite name for this step (if applicable; may be null)" }
            - { name: reason,     type: "string", desc: "optional completion reason (e.g., all_steps, composite_until)" }
            - { name: ctx,        type: "json",   desc: "skill context dictionary carried through execution" }

  # ─────────────────────────────
  # LLM tasks (broker, planner, orchestrator)
  # ─────────────────────────────

  llm_broker:
    description: "LLM that turns event + world state into SQL queries and facts."
    node: "/broker_node"
    outputs:
      - id: facts.json
        ros:
          topic: "/broker/facts"
          msg: "std_msgs/String"
        context:
          fields:
            - { name: n_facts, type: "int?", desc: "count of facts in payload (if computed by broker)" }

      - id: facts_delta.json
        ros:
          topic: "/broker/facts_delta"
          msg: "std_msgs/String"
        context:
          fields:
            - { name: n_delta, type: "int?", desc: "count of changed facts (if computed)" }

      - id: perf.json
        kind: perf
        ros:
          topic: "/llm/broker_perf"
          msg: "std_msgs/String"
        schema_hint: '{"node":"broker","model":str,"lat_ms":float,"ok":bool,"phase":str}'
        context:
          fields:
            - { name: node,   type: "string", desc: "node name 'broker'" }
            - { name: model,  type: "string", desc: "model id" }
            - { name: lat_ms, type: "float",  desc: "LLM latency (ms)" }
            - { name: ok,     type: "bool",   desc: "true if call succeeded" }
            - { name: phase,  type: "string", desc: "phase, e.g. 'draft','retry'" }
            - { name: ts,     type: "ts",     desc: "perf sample timestamp" }

    models:

      - id: gpt-oss-120b
        version: "gpt-oss-120b"
        role: "default"
        metrics:
          latency_ms: { typical: 1.0 }
        resources:
          device_pref: ["cloud"]
        parameters: {}

      - id: gpt-oss-20b
        version: "gpt-oss-20b"
        role: "default"
        metrics:
          latency_ms: { typical: 0.5 }
        resources:
          device_pref: ["cloud"]
        parameters: {}

      - id: gpt-4.1-nano
        version: "gpt-4.1-nano"
        role: "default"
        metrics:
          latency_ms: { typical: 10.0 }
        resources:
          device_pref: ["cloud"]
        parameters: {}
        
      - id: gpt-4.1-mini
        version: "gpt-4.1-mini"
        role: "default"
        metrics:
          latency_ms: { typical: 20.0 }
        resources:
          device_pref: ["cloud"]
        parameters: {}
    
      - id: gpt-5-nano
        version: "gpt-5.1-nano"
        role: "default"
        metrics:
          latency_ms: { typical: 40.0 }
        resources:
          device_pref: ["cloud"]
        parameters: {}

      - id: gpt-5-mini
        version: "gpt-5-mini"
        role: "higher_quality"
        metrics:
          latency_ms: { typical: 120.0 }
        resources:
          device_pref: ["cloud"]
        parameters: {}

  llm_planner:
    description: "LLM that turns broker facts + goals into high-level task plans."
    node: "/planner_node"
    outputs:
      - id: plan.json
        ros:
          topic: "/planner/plan"
          msg: "std_msgs/String"
        context:
          fields:
            - { name: has_plan,  type: "bool?", desc: "true if a plan was produced (if tagged)" }

      - id: needs.json
        ros:
          topic: "/planner/needs"
          msg: "std_msgs/String"
        context:
          fields:
            - { name: n_needs, type: "int?", desc: "number of needs (if tagged)" }

      - id: perf.json
        kind: perf
        ros:
          topic: "/llm/planner_perf"
          msg: "std_msgs/String"
        schema_hint: '{"node":"planner","model":str,"lat_ms":float,"ok":bool,"phase":str}'
        context:
          fields:
            - { name: node,   type: "string", desc: "node name 'planner'" }
            - { name: model,  type: "string", desc: "model id" }
            - { name: lat_ms, type: "float",  desc: "LLM latency (ms)" }
            - { name: ok,     type: "bool",   desc: "true if call succeeded" }
            - { name: phase,  type: "string", desc: "phase label" }
            - { name: ts,     type: "ts",     desc: "perf sample timestamp" }

    models:

      - id: gpt-oss-120b
        version: "gpt-oss-120b"
        role: "default"
        metrics:
          latency_ms: { typical: 1.0 }
        resources:
          device_pref: ["cloud"]
        parameters: {}    

      - id: gpt-oss-20b
        version: "gpt-oss-20b"
        role: "default"
        metrics:
          latency_ms: { typical: 0.5 }
        resources:
          device_pref: ["cloud"]
        parameters: {}

      - id: gpt-4.1-nano
        version: "gpt-4.1-nano"
        role: "default"
        metrics:
          latency_ms: { typical: 10.0 }
        resources:
          device_pref: ["cloud"]
        parameters: {}
        
      - id: gpt-4.1-mini
        version: "gpt-4.1-mini"
        role: "default"
        metrics:
          latency_ms: { typical: 20.0 }
        resources:
          device_pref: ["cloud"]
        parameters: {}
    
      - id: gpt-5-nano
        version: "gpt-5-nano"
        role: "default"
        metrics:
          latency_ms: { typical: 150.0 }
        resources:
          device_pref: ["cloud"]
        parameters: {}

      - id: gpt-5-mini
        version: "gpt-5-mini"
        role: "high_reasoning"
        metrics:
          latency_ms: { typical: 300.0 }
        resources:
          device_pref: ["cloud"]
        parameters: {}

  llm_orchestrator:
    description: "LLM that maps plans into executable skills and orchestrates execution."
    node: "/orchestrator_node"
    outputs:
      - id: skills_to_run.json
        ros:
          topic: "/orchestrator/skills"
          msg: "std_msgs/String"
        context:
          fields:
            - { name: n_skills, type: "int?", desc: "number of skills proposed (if tagged)" }

      - id: perf.json
        kind: perf
        ros:
          topic: "/llm/orchestrator_perf"
          msg: "std_msgs/String"
        schema_hint: '{"node":"orchestrator","model":str,"lat_ms":float,"ok":bool,"phase":str}'
        context:
          fields:
            - { name: node,   type: "string", desc: "node name 'orchestrator'" }
            - { name: model,  type: "string", desc: "model id" }
            - { name: lat_ms, type: "float",  desc: "LLM latency (ms)" }
            - { name: ok,     type: "bool",   desc: "true if call succeeded" }
            - { name: phase,  type: "string", desc: "phase label" }
            - { name: ts,     type: "ts",     desc: "perf sample timestamp" }

    models:
   
      - id: gpt-oss-120b
        version: "gpt-oss-120b"
        role: "default"
        metrics:
          latency_ms: { typical: 1.0 }
        resources:
          device_pref: ["cloud"]
        parameters: {}
    
      - id: gpt-oss-20b
        version: "gpt-oss-20b"
        role: "default"
        metrics:
          latency_ms: { typical: 0.5 }
        resources:
          device_pref: ["cloud"]
        parameters: {}
    
      - id: gpt-4.1-nano
        version: "gpt-4.1-nano"
        role: "default"
        metrics:
          latency_ms: { typical: 10.0 }
        resources:
          device_pref: ["cloud"]
        parameters: {}
        
      - id: gpt-4.1-mini
        version: "gpt-4.1-mini"
        role: "default"
        metrics:
          latency_ms: { typical: 20.0 }
        resources:
          device_pref: ["cloud"]
        parameters: {}
    
      - id: gpt-5-mini
        version: "gpt-5-mini"
        role: "default"
        metrics:
          latency_ms: { typical: 120.0 }
        resources:
          device_pref: ["cloud"]
        parameters: {}

      - id: gpt-5-nano
        version: "gpt-5-nano"
        role: "low_latency_fallback"
        metrics:
          latency_ms: { typical: 40.0 }
        resources:
          device_pref: ["cloud"]
        parameters: {}

  audio_tts:
    description: "Text-to-speech synthesis; publishes WAV bytes for playback and perf telemetry."
    node: "/tts_node"
    outputs:
      - id: wav.bytes
        ros: { msg: std_msgs/UInt8MultiArray, topic: "/tts_wav" }
        context:
          fields: []   # audio bytes are not directly rule-addressable

      - id: perf.json
        kind: perf
        ros:
          msg: std_msgs/String
          topic: "/tts/perf"
        schema_hint: >
          {"node":"tts","task":"audio_tts","model":str,"lat_ms":float,"ok":bool,
           "phase":str,"n_chunks":int,"n_bytes":int,"ts":float}
        context:
          fields:
            - { name: node,     type: "string", desc: "node name 'tts'" }
            - { name: task,     type: "string", desc: "task id 'audio_tts'" }
            - { name: model,    type: "string", desc: "tts model identifier" }
            - { name: lat_ms,   type: "float",  desc: "synthesis latency (ms)" }
            - { name: ok,       type: "bool",   desc: "true if synthesis ok" }
            - { name: phase,    type: "string", desc: "phase label" }
            - { name: n_chunks, type: "int",    desc: "number of generated chunks" }
            - { name: n_bytes,  type: "int",    desc: "size of audio payload" }
            - { name: ts,       type: "ts",     desc: "perf timestamp" }

    services:
      set_model:
        param_service: "/tts_node/set_parameters"
        param_name: "model_profile"
        type: "rcl_interfaces/SetParameters"

    models:
      - id: mms-eng
        version: "facebook/mms-tts-eng"
        description: "Open VITS-based English TTS (HF)."
        metrics:
          latency_ms: { synth_total_typical: 250.0 }   # ballpark; updated by runtime EMA
          throughput_fps: { n/a: 0.0 }
        resources: { device_pref: ["cuda","cpu"], memory_mb: 900, vram_mb: 800 }
        parameters:
          target_sr:
            type: "int"
            default: 16000
          use_half:
            type: "bool"
            default: false

      - id: elevenlabs-turbo
        version: "eleven_turbo_v2_5"
        description: "Cloud TTS (fast, expressive)."
        metrics:
          latency_ms: { synth_total_typical: 180.0 }
        resources:
          device_pref: ["cloud"]
        parameters:
          voice_name:
            type: "string"
            default: "XrExE9yKIg1WjnnlVkGX"
          stability:
            type: "float"
            default: 0.50
          similarity_boost:
            type: "float"
            default: 0.50

  vlm_inference:
    description: "Vision-language micro-service that answers prompts about the latest camera frame."
    node: "/qwen_vlm_server"

    outputs:
      - id: answer.text
        ros:
          msg: std_msgs/String
          topic: "/vlm/answer"

        context:
          fields:
            - { name: id,        type: "string", desc: "Correlation id copied from request (if used)" }
            - { name: success,   type: "bool",   desc: "True if VLM call & JSON normalization succeeded" }
            - { name: raw_text,  type: "string", desc: "Raw VLM completion text (may not be valid JSON)" }
            - { name: json_text, type: "string", desc: "Normalized STRICT JSON string, or empty if parse failed" }
            - { name: model_id,  type: "string", desc: "Model id used for this request" }
            - { name: lat_ms,    type: "float",  desc: "End-to-end latency in milliseconds" }
            - { name: tag,       type: "string", desc: "Optional free-form tag from the request" }
            - { name: ts,        type: "ts",     desc: "EventLayer timestamp when message was processed" }

      - id: perf.json
        kind: perf
        ros:
          msg: std_msgs/String
          topic: "/vlm/perf"

        context:
          fields:
            - { name: node,       type: "string", desc: "node name 'vlm'" }
            - { name: task,       type: "string", desc: "task id 'vlm_inference'" }
            - { name: model,      type: "string", desc: "model id" }
            - { name: lat_ms,     type: "float",  desc: "VLM latency (ms)" }
            - { name: ok,         type: "bool",   desc: "true if inference ok" }
            - { name: phase,      type: "string", desc: "phase label" }
            - { name: prompt_len, type: "int",    desc: "prompt length" }
            - { name: answer_len, type: "int",    desc: "answer length" }
            - { name: ts,         type: "ts",     desc: "perf timestamp" }

    services:
      enable:
        name: "/vlm/enable"
        type: "std_srvs/SetBool"
      set_model:
        param_service: "/qwen_vlm_server/set_parameters"
        param_name: "model_id"
        type: "rcl_interfaces/SetParameters"

    models:
      - id: Qwen/Qwen3-VL-4B-Thinking
        version: "Qwen/Qwen3-VL-4B-Thinking"
        description: "4B Qwen VLM"
        metrics:
          latency_ms: { run_trigger_typical: 800.0 }
        resources:
          device_pref: ["cuda"]
          memory_mb: 16000
          vram_mb: 12000
        parameters:
          int4:
            type: "bool"
            default: true
          bf16:
            type: "bool"
            default: true

      - id: Qwen/Qwen2.5-VL-7B-Instruct
        version: "Qwen/Qwen2.5-VL-7B-Instruct"
        description: "7B Qwen VLM, full bf16."
        metrics:
          latency_ms: { run_trigger_typical: 1200.0 }
        resources:
          device_pref: ["cuda"]
          memory_mb: 20000
          vram_mb: 16000
        parameters:
          int4:
            type: "bool"
            default: false
          bf16:
            type: "bool"
            default: true
  

  llm_speech_check:
    description: "LLM micro-service that classifies or validates the latest utterance."
    node: "/llm_speech_check"          # ROS node that wraps the LLM

    outputs:
      - id: check.json
        ros:
          topic: "/llm/speech_check"
          msg: "std_msgs/String"
        schema_hint: >
          {"kind":str,"intent":str,"ok":bool,"confidence":float,
           "text":str,"ts":float}
        context:
          fields:
            - { name: id,        type: "string", desc: "Correlation id copied from /llm/speech_check_req" }
            - { name: success,   type: "bool",   desc: "True if LLM call & JSON normalization succeeded" }
            - { name: raw_text,  type: "string", desc: "Raw LLM completion text (may not be valid JSON)" }
            - { name: json_text, type: "string", desc: "Normalized STRICT JSON string, or empty if parse failed" }
            - { name: model_id,  type: "string", desc: "Model id used for this request" }
            - { name: lat_ms,    type: "float",  desc: "End-to-end latency in milliseconds" }
            - { name: tag,       type: "string", desc: "Optional free-form tag from the request" }
            # Added by EventLayer when it builds ctx
            - { name: ts,        type: "ts",     desc: "EventLayer timestamp when message was processed" }


      - id: perf.json
        kind: perf
        ros:
          topic: "/llm/speech_check_perf"
          msg: "std_msgs/String"
        context:
          fields:
            - { name: model,  type: "string", desc: "Model id used for this check" }
            - { name: lat_ms, type: "float",  desc: "Latency in milliseconds" }
            - { name: ok,     type: "bool",   desc: "True if request completed without error" }
            - { name: tag,    type: "string", desc: "Optional tag / scenario label" }
            # Also directly from the node
            - { name: ts,     type: "ts",     desc: "Timestamp (sec) from node when metrics were recorded" }


    services:
      enable:
        name: "/llm_speech_check/enable"
        type: "std_srvs/SetBool"
      set_model:
        param_service: "/llm_speech_check/set_parameters"
        param_name: "model_id"
        type: "rcl_interfaces/SetParameters"

    models:
      - id: gpt-5-nano
        version: "gpt-5-nano"
        description: "Low-latency LLM for simple utterance checks."
        metrics:
          latency_ms: { typical: 60.0 }
        resources:
          device_pref: ["cloud"]
          memory_mb: 0
          vram_mb: 0
        parameters:
          max_new_tokens:
            type: "int"
            default: 128
          temperature:
            type: "float"
            default: 0.2
          top_p:
            type: "float"
            default: 0.9

      - id: gpt-5.1-mini
        version: "gpt-5.1-mini"
        description: "Higher-quality LLM for nuanced checks."
        metrics:
          latency_ms: { typical: 150.0 }
        resources:
          device_pref: ["cloud"]
          memory_mb: 0
          vram_mb: 0
        parameters:
          max_new_tokens:
            type: "int"
            default: 256
          temperature:
            type: "float"
            default: 0.3
          top_p:
            type: "float"
            default: 0.9


  llm_hdt:
    description: "LLM that maintains human digital twin profiles (H1/H2) from context capsules."
    node: "/hdt_node"

    outputs:
      - id: profiles.json
        ros:
          topic: "/profiles/summary"
          msg: "std_msgs/String"
        # Conceptual payload:
        # {
        #   "H1": { ...profile... },
        #   "H2": { ...profile... },
        #   "_meta": {"active_human":"H2","robot_zone":"B","ts":...}
        # }
        context:
          fields:
            - { name: active_human, type: "string?", desc: "most likely active human id (from _meta.active_human)" }
            - { name: robot_zone,   type: "string?", desc: "robot zone as seen by HDT (from _meta.robot_zone)" }
            - { name: ts,           type: "ts?",     desc: "last update timestamp (from _meta.ts)" }

      - id: perf.json
        kind: perf
        ros:
          topic: "/llm/hdt_perf"
          msg: "std_msgs/String"
        schema_hint: >
          {"node":"hdt","model":str,"lat_ms":float,"ok":bool,"phase":str,"ts":float}
        context:
          fields:
            - { name: node,   type: "string", desc: "node name 'hdt'" }
            - { name: model,  type: "string", desc: "LLM model id used" }
            - { name: lat_ms, type: "float",  desc: "LLM latency (ms) for profile update" }
            - { name: ok,     type: "bool",   desc: "true if HDT LLM call + validation succeeded" }
            - { name: phase,  type: "string", desc: "phase label (e.g. 'profile_update')" }
            - { name: ts,     type: "ts",     desc: "perf sample timestamp" }

    services:
      update_now:
        name: "/hdt_node/update_profiles"
        type: "std_srvs/Trigger"
      set_model:
        # lets you switch the *base* model param at runtime
        param_service: "/hdt_node/set_parameters"
        param_name: "model"
        type: "rcl_interfaces/SetParameters"

    models:
    
      - id: gpt-oss-120b
        version: "gpt-oss-120b"
        role: "default"
        metrics:
          latency_ms: { typical: 1.0 }
        resources:
          device_pref: ["cloud"]
        parameters: {}
        
      - id: gpt-oss-20b
        version: "gpt-oss-20b"
        role: "default"
        metrics:
          latency_ms: { typical: 0.5 }
        resources:
          device_pref: ["cloud"]
        parameters: {}
    
      - id: gpt-4.1-nano
        version: "gpt-4.1-nano"
        role: "default"
        metrics:
          latency_ms: { typical: 10.0 }
        resources:
          device_pref: ["cloud"]
        parameters: {}
        
      - id: gpt-4.1-mini
        version: "gpt-4.1-mini"
        role: "default"
        metrics:
          latency_ms: { typical: 20.0 }
        resources:
          device_pref: ["cloud"]
        parameters: {}
    
      - id: gpt-5-nano
        version: "gpt-5-nano"
        role: "default"
        metrics:
          latency_ms: { typical: 150.0 }   # ballpark, will be overwritten by EMA
        resources:
          device_pref: ["cloud"]
          memory_mb: 0
          vram_mb: 0
        parameters:
          temperature:
            type: "float"
            default: 0.2

      - id: gpt-5-mini
        version: "gpt-5-mini"
        role: "higher_quality"
        metrics:
          latency_ms: { typical: 250.0 }
        resources:
          device_pref: ["cloud"]
          memory_mb: 0
          vram_mb: 0
        parameters:
          temperature:
            type: "float"
            default: 0.2


