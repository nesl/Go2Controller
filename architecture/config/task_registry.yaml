version: 1
meta:
  project: robot-perception
  units:
    latency_ms: "ms (mean/EMA)"
    throughput_fps: "frames/s at stated resolution"
    memory_mb: "approx resident"
  notes: "Tasks declare outputs; models implement task with metrics/params."

tasks:

  odometry_tracking:
      description: "Track robot base pose for distance and rotation changes"
      node: ""   # Not required unless you dynamically enable something
      outputs:
        - id: "odom"
          ros:
            topic: "/odom"
            msg: "nav_msgs/Odometry"

  object_detection:
    description: "2D objects; optionally your node adds 3D map poses via depth/TF."
    node: "/coco_detector"             # <— ROS node name that runs this task
    outputs:
      - id: detection.2d
        ros: { msg: vision_msgs/Detection2DArray, topic: "/detected_objects" }
        fields: ["class","score","bbox","pose_3d?","frame_id"]
      - id: image.annotated
        ros: { msg: sensor_msgs/Image, topic: "/annotated_image" }
      - id: markers
        ros: { msg: visualization_msgs/MarkerArray, topic: "/visualization_marker_array" }
      - id: perf.json
        ros: { msg: std_msgs/String, topic: "/yolo_perf" }
        schema_hint: '{"latency_ms":{"det":num,"pose":num,"total":num},"fps_ema":num}'
    services:
      enable:                                # std_srvs/SetBool to gate inference
        name: "/toggle_yolo"
        type: "std_srvs/SetBool"
      set_model:                             # rcl_interfaces/SetParameters to switch weights
        param_service: "/coco_detector/set_parameters"
        param_name: "yolo_weights"
        type: "rcl_interfaces/SetParameters"
      # optional 'reload' poke after changing params (if your node needs it)
      # reload:
      #   name: "/toggle_yolo"
      #   type: "std_srvs/SetBool"

    models:
      - id: yolo11n
        version: "11n"
        description: "Nano detector (very low latency)."
        metrics:
          latency_ms: { det_mean: 8.0 }       # example at 640p
          throughput_fps: { rgb_640: 60.0 }
          accuracy: { coco_map_50_95: 0.38 }
        resources: { device_pref: ["cuda","cpu"], memory_mb: 600, vram_mb: 500 }
        parameters:
          detection_threshold: { default: 0.30 }
          device: { default: "cuda" }
          weights: "yolo11n.pt"

      - id: yolo11x
        version: "11x"
        description: "High-accuracy detector."
        metrics:
          latency_ms: { det_mean: 22.0 }
          throughput_fps: { rgb_640: 30.0 }
          accuracy: { coco_map_50_95: 0.53 }
        resources: { device_pref: ["cuda","cpu"], memory_mb: 2600, vram_mb: 2400 }
        parameters:
          detection_threshold: { default: 0.25 }
          device: { default: "cuda" }
          weights: "yolo11x.pt"

  pose_detection:
    description: "Human keypoints (COCO-17), on-demand."
    node: "/coco_detector"              # same node publishes pose JSON
    outputs:
      - id: pose.json
        ros: { msg: std_msgs/String, topic: "/yolo_pose_json" }
        schema_hint: '{"persons":[{"bbox":[x1,y1,x2,y2],"score":p,"keypoints":[[x,y,conf],...]}]}'
      - id: image.annotated
        ros: { msg: sensor_msgs/Image, topic: "/annotated_image" }
      - id: perf.json
        ros: { msg: std_msgs/String, topic: "/yolo_perf" }
        schema_hint: '{"latency_ms":{"pose":num}}'
    services:
      enable:
        name: "/toggle_yolo_pose"
        type: "std_srvs/SetBool"
      set_model:
        param_service: "/coco_detector/set_parameters"
        param_name: "yolo_pose_weights"
        type: "rcl_interfaces/SetParameters"

    models:
      - id: yolo11n-pose
        version: "11n-pose"
        metrics:
          latency_ms: { pose_mean: 14.0 }
          throughput_fps: { rgb_640: 55.0 }
          accuracy: { keypoint_AP_50_95: 0.50 }
        resources: { device_pref: ["cuda","cpu"], memory_mb: 800, vram_mb: 700 }
        parameters: { device: { default: "cuda" }, weights: "yolo11n-pose.pt" }

      - id: yolo11x-pose
        version: "11x-pose"
        metrics:
          latency_ms: { pose_mean: 35.0 }
          throughput_fps: { rgb_640: 22.0 }
          accuracy: { keypoint_AP_50_95: 0.63 }
        resources: { device_pref: ["cuda","cpu"], memory_mb: 2800, vram_mb: 2500 }
        parameters: { device: { default: "cuda" }, weights: "yolo11x-pose.pt" }

  audio_gating:
    description: "Low-latency gate; partial text and DoA summary per window."
    node: "/stt_angle"
    outputs:
      - id: text.partial
        ros: { msg: std_msgs/String, topic: "/audio/stt_partial_json" }
        schema_hint: '{"kind":"partial_gate","text":str,"avg_logprob":num,"lat_ms":num,"doa":{"angle_mode_deg":num,"angle_mean_deg":num}}'
      - id: perf.json
        ros: { msg: std_msgs/String, topic: "/stt_perf" }
    services:
      enable:
        name: "/toggle_gate"
        type: "std_srvs/SetBool"
      set_model:
        param_service: "/stt_angle/set_parameters"
        param_name: "wg_model_size"
        type: "rcl_interfaces/SetParameters"

    models:
      - id: whisper
        version: "large-v3"
        metrics: { latency_ms: { window_infer_mean: 25.0 } }
        resources: { device_pref: ["cuda","cpu"], memory_mb: 2200, vram_mb: 1600 }
        parameters:
          wg_window_ms: { default: 3000 }
          wg_hop_ms: { default: 1000 }

  audio_asr:
    description: "Final, higher-quality utterance transcription."
    node: "/stt_angle"
    outputs:
      - id: text.final
        ros: { msg: std_msgs/String, topic: "/audio/stt_text" }
        schema_hint: '{"text": str}'
      - id: json.final
        ros: { msg: std_msgs/String, topic: "/audio/stt_doa_json" }
        schema_hint: '{"text":str,"azimuth_deg":num,"stamp":{...}}'
      - id: perf.json
        ros: { msg: std_msgs/String, topic: "/stt_perf" }
    services:
      enable:
        name: "/toggle_stt"
        type: "std_srvs/SetBool"
      set_model:
        param_service: "/stt_angle/set_parameters"
        param_name: "stt_model_size"
        type: "rcl_interfaces/SetParameters"

    models:
      - id: whisper
        version: "hf-medium"
        metrics: { latency_ms: { utter_infer_mean: 160.0 } }
        resources: { device_pref: ["cuda","cpu"], memory_mb: 3200, vram_mb: 2400 }
        parameters:
          stt_model_size: { default: "medium", enum: ["tiny","base","small","medium","large-v3"] }
          stt_chunk_s: { default: 30.0 }
          

  bt_proximity:
    description: "Raw Bluetooth RSSI readings for objects (no TF/DB)."
    node: ""   # no enable/disable service required for the event layer
    outputs:
      - id: "bt.reading"
        ros:
          topic: "/bt/readings"
          msg: "bt_msgs/BtReading"
        # Available fields in rule context (from the event layer):
        # rssi:int, object_id:str, device_id:str, phone_id:str, frame_id:str, strength_bucket:str, ts:float
        
  skill_status:
    description: "Skill execution status and completion events."
    node: ""   # no enable/disable; published directly by SkillsAgent
    outputs:
      - id: "skill.status"
        ros:
          topic: "/skills/status"
          msg: "std_msgs/String"
        # schema_hint (conceptual):
        # '{"skill":str,"status":str,"reason":str,"step_idx":int,"ctx":{...}}'

  # ─────────────────────────────
  # LLM tasks (broker, planner, orchestrator)
  # ─────────────────────────────

  llm_broker:
    description: "LLM that turns event + world state into SQL queries and facts."
    node: "/broker_node"
    outputs:
      - id: facts.json
        ros:
          topic: "/broker/facts"
          msg: "std_msgs/String"
      - id: facts_delta.json
        ros:
          topic: "/broker/facts_delta"
          msg: "std_msgs/String"
      - id: perf.json
        kind: perf
        ros:
          topic: "/llm/broker_perf"
          msg: "std_msgs/String"
        schema_hint: '{"node":"broker","model":str,"lat_ms":num,"ok":bool,"phase":str}'
    models:
      - id: gpt-5-nano
        version: "gpt-5.1-nano"
        role: "default"
        metrics:
          latency_ms: { typical: 40.0 }
        resources:
          device_pref: ["cloud"]
      - id: gpt-4.1-mini
        version: "gpt-4.1-mini"
        role: "higher_quality"
        metrics:
          latency_ms: { typical: 120.0 }
        resources:
          device_pref: ["cloud"]

  llm_planner:
    description: "LLM that turns broker facts + goals into high-level task plans."
    node: "/planner_node"
    outputs:
      - id: plan.json
        ros:
          topic: "/planner/plan"
          msg: "std_msgs/String"
      - id: needs.json
        ros:
          topic: "/planner/needs"
          msg: "std_msgs/String"
      - id: perf.json
        kind: perf
        ros:
          topic: "/llm/planner_perf"
          msg: "std_msgs/String"
        schema_hint: '{"node":"planner","model":str,"lat_ms":num,"ok":bool,"phase":str}'
    models:
      - id: gpt-4.1-mini
        version: "gpt-4.1-mini"
        role: "default"
        metrics:
          latency_ms: { typical: 150.0 }
        resources:
          device_pref: ["cloud"]
      - id: gpt-4.1
        version: "gpt-4.1"
        role: "high_reasoning"
        metrics:
          latency_ms: { typical: 300.0 }
        resources:
          device_pref: ["cloud"]

  llm_orchestrator:
    description: "LLM that maps plans into executable skills and orchestrates execution."
    node: "/orchestrator_node"
    outputs:
      - id: skills_to_run.json
        ros:
          topic: "/orchestrator/skills"
          msg: "std_msgs/String"
      - id: perf.json
        kind: perf
        ros:
          topic: "/llm/orchestrator_perf"
          msg: "std_msgs/String"
        schema_hint: '{"node":"orchestrator","model":str,"lat_ms":num,"ok":bool,"phase":str}'
    models:
      - id: gpt-4.1-mini
        version: "gpt-4.1-mini"
        role: "default"
        metrics:
          latency_ms: { typical: 120.0 }
        resources:
          device_pref: ["cloud"]
      - id: gpt-5-nano
        version: "gpt-5.1-nano"
        role: "low_latency_fallback"
        metrics:
          latency_ms: { typical: 40.0 }
        resources:
          device_pref: ["cloud"]


  audio_tts:
    description: "Text-to-speech synthesis; publishes WAV bytes for playback and perf telemetry."
    node: "/tts_node"
    outputs:
      - id: wav.bytes
        ros: { msg: std_msgs/UInt8MultiArray, topic: "/tts_wav" }
      - id: perf.json
        kind: perf
        ros:
          msg: std_msgs/String
          topic: "/tts/perf"
        schema_hint: >
          {"node":"tts","task":"audio_tts","model":str,"lat_ms":num,"ok":bool,
           "phase":str,"n_chunks":int,"n_bytes":int,"ts":num}
           
    services:
      set_model:
        param_service: "/tts_node/set_parameters"
        param_name: "model_profile"
        type: "rcl_interfaces/SetParameters"
           
    models:
      - id: mms-eng
        version: "facebook/mms-tts-eng"
        description: "Open VITS-based English TTS (HF)."
        metrics:
          latency_ms: { synth_total_typical: 250.0 }   # ballpark; updated by runtime EMA
          throughput_fps: { n/a: 0.0 }
        resources: { device_pref: ["cuda","cpu"], memory_mb: 900, vram_mb: 800 }
        parameters:
          target_sr: { default: 16000 }
          use_half: { default: false }
      - id: elevenlabs-turbo
        version: "eleven_turbo_v2_5"
        description: "Cloud TTS (fast, expressive)."
        metrics:
          latency_ms: { synth_total_typical: 180.0 }
        resources: { device_pref: ["cloud"] }
        parameters:
          voice_name: { default: "XrExE9yKIg1WjnnlVkGX" }
          stability: { default: 0.50 }
          similarity_boost: { default: 0.50 }

  vlm_inference:
    description: "Vision-language model answering prompts about the latest camera frame."
    node: "/qwen_vlm_server"
    outputs:
      - id: answer.text
        ros:
          msg: std_msgs/String
          topic: "/vlm/answer"
      - id: perf.json
        kind: perf
        ros:
          msg: std_msgs/String
          topic: "/vlm/perf"
        schema_hint: >
          {"node":"vlm","task":"vlm_inference","model":str,"lat_ms":num,
           "ok":bool,"phase":str,"prompt_len":int,"answer_len":int,"ts":num}
    services:
      enable:
        name: "/vlm/enable"
        type: "std_srvs/SetBool"
      set_model:
        param_service: "/qwen_vlm_server/set_parameters"
        param_name: "model_id"
        type: "rcl_interfaces/SetParameters"
    models:
      - id: qwen2.5-vl-7b-int4
        version: "Qwen/Qwen2.5-VL-7B-Instruct"
        description: "7B Qwen VLM, int4 quantized."
        metrics:
          latency_ms: { run_trigger_typical: 800.0 }   # rough; will be refined by EMA
        resources:
          device_pref: ["cuda","cpu"]
          memory_mb: 16000
          vram_mb: 12000
        parameters:
          int4: { default: true }
          bf16: { default: true }
      - id: qwen2.5-vl-7b-bf16
        version: "Qwen/Qwen2.5-VL-7B-Instruct"
        description: "7B Qwen VLM, full bf16."
        metrics:
          latency_ms: { run_trigger_typical: 1200.0 }
        resources:
          device_pref: ["cuda"]
          memory_mb: 20000
          vram_mb: 16000
        parameters:
          int4: { default: false }
          bf16: { default: true }


