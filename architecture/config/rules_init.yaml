version: 1
defaults:
  window_ms: 3000
  composite_window_ms: 2000

rules:
  - id: pose_present_precise
    enabled: true
    task: pose_detection
    output: pose.json
    model_id: "yolo11x-pose"
    mode: "edge"
    emit_off: true      # ALSO emit when it becomes false again
    expr: "persons >= 1"

  - id: human_detected_3d
    enabled: true
    task: object_detection
    output: detection.2d
    mode: "edge"
    emit_off: true      # ALSO emit when it becomes false again
    # Only when 3D available and confident enough (tune threshold)
    expr: "cls == 'person' and (map_x is not None) and (map_y is not None) and score >= 0.40"


  - id: speech_keyword
    enabled: true
    task: audio_gating
    output: text.partial
    model_id: "whisper" 
    mode: "level"                          # Whisper gate size
    expr: "text and any(x in text.lower() for x in ['hello','help'])"

  - id: speech_final_any
    enabled: true
    task: audio_asr
    output: text.final
    model_id: "small"   
    mode: "level"                       # Whisper ASR size
    expr: "text and len(text) >= 3"

  - id: trigger_speech_final
    enabled: false
    task: audio_asr
    output: text.final
    model_id: "small" 
    mode: "level"                          
    expr: "text and any(x in text.lower() for x in ['bob'])"

  # Human greeting + presence co-occur (for nice social responses).
  - id: human_ping_here
    enabled: true
    publish: false
    type: composite
    expr: "exists('speech_final_any', 100000) and exists('human_detected_3d', 100000)"
    
  # --- Odometry deltas as basic events ---
  - id: odom_rot_delta
    enabled: true
    task: odometry_tracking
    publish: false
    output: odom
    mode: "level"
    # fire on every >= 3° change; payload carries dyaw_deg
    expr: "dyaw_deg >= 3"

  - id: odom_dist_delta
    enabled: true
    publish: false
    task: odometry_tracking
    output: odom
    mode: "level"
    # fire on every >= 0.05 m change; payload carries dxy
    expr: "dxy >= 0.05"
    
  - id: bt_rssi_seen
    enabled: true
    task: bt_proximity
    output: bt.reading
    mode: "level"
    # Fire on any reasonably strong reading; tune threshold as you like:
    expr: "rssi >= -90"

  - id: skill_done_any
    enabled: true
    task: skill_status
    output: skill.status
    mode: "level"
    expr: "kind == 'skill_finished' and done"
    
  # VLM scene answer available and parsed JSON exists.
  - id: vlm_scene_ready
    enabled: true
    task: vlm_inference
    output: answer.text
    mode: "level"
    expr: "success and json_text is not None and json_text != ''"
    
  - id: speech_intent_inferred
    enabled: true
    type: basic
    mode: level
    task: llm_speech_check
    output: check.json
    expr: "success and json_text is not None and json_text != ''"
    
  # Same idea as speech_final_any, but from json.final so we can access azimuth_deg.
  - id: speech_final_with_doa
    enabled: true
    task: audio_asr
    output: json.final
    model_id: "small"
    mode: "level"
    expr: "text and len(text) >= 3"
    
  - id: skill_started_any
    enabled: true
    task: skill_status
    output: skill.status
    mode: "level"
    expr: "kind == 'skill_started'"

  - id: trigger_idle
    enabled: true
    one_shot: true
    type: composite
    expr: >
      exists('skill_done_any', 86400000) and
      not exists('skill_done_any', 30000)
      and not exists('skill_started_any', 30000)
      and not exists('speech_final_any', 30000)
      

  # in rules_init.yaml or dynamic rules
  - id: robot_spoke_any
    enabled: true
    type: basic
    task: "skill_status"
    output: "skill.status"
    mode: "edge"
    expr: "kind == 'step_started' and skill == 'tts.say' and isinstance(inner_ctx.get('text'), str)"
    publish: true

      
  # ───────── LLM: interpret human intent from final utterance ─────────
  - id: llm_infer_intent
    enabled: false
    type: composite

    # Trigger whenever we receive a final ASR utterance
    expr: "exists('speech_final_any', 5000)"

    llm_call:
      task: "llm_speech_check"           # uses your LLM request/response path
      output_id: "check.json"            # EventLayer already parses this

      # One call per utterance (no throttling)
      min_period_ms: 0       

      # Where the text should come from
      text_from_rule_id: "speech_final_any"

      tag: "intent_inference"

      prompt_template: |
        You are the cognitive layer for robot Bob.
        Infer the user's intention from the utterance below.

        Extract:
        - **intent_class**: one of {command, question, greeting, request_help,
          clarification, small_talk, refer_object, other}
        - **target_object**: the object or CNode id (if mentioned or implied),
          otherwise null
        - **action**: a short verb phrase capturing what the user wants the robot
          or another human to do (e.g., "pick up", "come here", "follow me")
        - **parameters**: key parameters if present (e.g., location, zone, count)
        - **certainty**: 0.0–1.0 measure of how confident you are
        - **natural_summary**: 1–2 sentence explanation in natural language

        Respond with STRICT JSON only.

      output_schema: |
        {
          "type": "object",
          "required": [
            "intent_class",
            "target_object",
            "action",
            "parameters",
            "certainty",
            "natural_summary"
          ],
          "properties": {
            "intent_class": {
              "type": "string",
              "enum": [
                "command","question","greeting","request_help",
                "clarification","small_talk","refer_object","other"
              ]
            },
            "target_object": { "type": ["string","null"] },
            "action":        { "type": ["string","null"] },
            "parameters":    { "type": "object" },
            "certainty":     { "type": "number" },
            "natural_summary": { "type": "string" }
          }
        }

  # ───────── VLM: describe scene when humans are around (rate-limited) ─────────
  - id: vlm_describe_scene_with_human
    enabled: false
    type: composite
    # Only fire when we have a 3D human detection in the last 3 seconds
    expr: "exists('human_detected_3d', 3000)"
    llm_call:
      task: "vlm_inference"                 # matches tasks.vlm_inference
      output_id: "answer.text"
      # Don't spam VLM: at most once every 15 seconds while humans are present
      min_period_ms: 15000
      tag: "scene_human_present"

      prompt_template: |
        You are the robot Bob looking at the current camera frame.

        1. Briefly describe the scene.
        2. List the people you see and where they are.
        3. For each person, guess which nearby object they might be
           interacting with or referring to, if any.

        Respond ONLY with STRICT JSON matching the schema below.

      output_schema: |
        {
          "type": "object",
          "required": ["summary","people","objects"],
          "properties": {
            "summary": { "type": "string" },
            "people": {
              "type": "array",
              "items": {
                "type": "object",
                "required": ["id","description","likely_object_id","confidence"],
                "properties": {
                  "id":              { "type": "string" },
                  "description":     { "type": "string" },
                  "likely_object_id":{ "type": ["string","null"] },
                  "confidence":      { "type": "number" }
                }
              }
            },
            "objects": {
              "type": "array",
              "items": {
                "type": "object",
                "required": ["id","description"],
                "properties": {
                  "id":          { "type": "string" },
                  "description": { "type": "string" }
                }
              }
            }
          }
        }
        
  - id: llm_speech_to_multiagent_plan
    enabled: true
    type: composite

    # Trigger whenever we receive a final ASR utterance
    expr: "exists('speech_final_any', 5000)"

    llm_call:
      task: "llm_speech_check"        # your LLM backend task name
      output_id: "check.json"     # EventLayer will parse this as JSON

      min_period_ms: 0
      text_from_rule_id: "speech_final_any"
      history_source_rules_json: '["speech_final_any","robot_spoke_any"]'
      history_window_ms: 60000
      history_max_items: 8
      tag: "command_to_plan"

      prompt_template: |
        You are the cognitive layer for robot Bob in an X/Y boxes task.

        The environment:
        - There are numbered boxes: box 1, box 2, ...
        - Each box may have properties X and/or Y.
        - There are three agents in the team:
            * "robot"   : the robot
            * "human_a" : Human A (X-specialist)
            * "human_b" : Human B (Y-specialist)
        - Each agent can perform two kinds of actions on boxes:
            * "sense"   : move to a box and test a property (X or Y).
            * "dispose" : pick up and dispose a box that has already been confirmed.

        Your job:
        Given ONE human utterance, decide whether it contains a DIRECT PLAN or COMMAND
        that assigns actions to any of these agents (robot, human_a, human_b).
        If so, normalize it into a short multi-agent plan.

        1. COMMAND / PLAN DETECTION

           Treat an utterance as a command/plan if it clearly specifies what any agent
           (robot, human_a, or human_b) should do.

           Examples of COMMAND/PLAN utterances:
           - "Robot, go sense X on box 5."
           - "I'll take the X boxes, you take the Y boxes."
           - "Robot, check box 8 for Y, and Human A should dispose box 3."

           Non-command examples:
           - "What are you doing right now?"
           - "This is hard."
           - "Are we almost done?"

        2. AGENT ASSIGNMENT

           When the utterance refers to "you", assume it refers to the ROBOT unless it is
           clearly part of a human-human conversation. If the utterance clearly assigns
           tasks to humans, map them as:

             - "I'll take X boxes"      -> typically the speaker (assume "human_a" if
                                           the speaker is X-specialist; otherwise
                                           use "human_a" or "human_b" only if the
                                           utterance clearly names them).
             - "You take the Y boxes"   -> assign to "human_b" if Y is clearly their domain.
             - "B, go check box 3"      -> "human_b".
             - "A, handle the X boxes"  -> "human_a".

           If you cannot confidently assign a human, put that step in "other_humans".

        3. PLAN NORMALIZATION

           If the utterance IS a command/plan, extract a SEQUENCE of steps for each agent.

           Each step must have:
             - box_id   : integer box id, if mentioned explicitly (e.g., "box 5").
                          If you cannot infer it, use null.
             - property : "X", "Y", or null.
                          Use:
                            * "X" if they clearly refer to X-boxes.
                            * "Y" if they clearly refer to Y-boxes.
                            * null if the property is unclear or irrelevant.
             - kind     : "sense" or "dispose".
                          Use:
                            * "sense"  for actions like "check", "test", "scan", "look at".
                            * "dispose" for actions like "throw away", "remove", "take out".

           Your output should organize plan steps by agent in an "agents_plan" object:

             "agents_plan": {
               "robot":   [ step, step, ... ],
               "human_a": [ step, ... ],
               "human_b": [ step, ... ],
               "other_humans": [ step, ... ]
             }

           Any of these arrays may be empty. If there is no meaningful plan at all,
           agents_plan must be null.

           Guidelines:
             - Keep the plan SHORT and EXECUTABLE, typically 1–5 steps per agent.
             - Respect order within each agent's list if the utterance clearly imposes order
               (e.g., "first do X on box 5, then Y on box 8").
             - If the command is vague ("check the nearest X box"), you may:
               * set box_id = null, property = "X", kind = "sense".

        4. OUTPUT FORMAT

           You MUST respond with STRICT JSON ONLY, no explanations or markdown.

           Fields to output:
             - is_command      : boolean (true if this is a plan/command involving any agent)
             - command_type    : string, one of:
                                 ["robot_only", "multi_agent_plan", "non_command", "ambiguous"]
             - agents_plan     : null OR an object with per-agent plan arrays as described
             - certainty       : number between 0.0 and 1.0 indicating your confidence
                                 that this is correctly interpreted
             - natural_summary : 1–2 sentence explanation in natural language of what
                                 the human wants the agents to do.

        Example 1 (for your understanding only):

          Utterance: "Robot, go test X on box 5 and then check box 8 for Y."
          =>
          {
            "is_command": true,
            "command_type": "robot_only",
            "agents_plan": {
              "robot": [
                { "box_id": 5, "property": "X", "kind": "sense" },
                { "box_id": 8, "property": "Y", "kind": "sense" }
              ],
              "human_a": [],
              "human_b": [],
              "other_humans": []
            },
            "certainty": 0.95,
            "natural_summary": "The human is asking the robot to first sense property X on box 5, then sense property Y on box 8."
          }

        Example 2:

          Utterance: "I'll handle the X boxes, B, you take the Y boxes, and robot check box 3 for Y."
          =>
          {
            "is_command": true,
            "command_type": "multi_agent_plan",
            "agents_plan": {
              "robot": [
                { "box_id": 3, "property": "Y", "kind": "sense" }
              ],
              "human_a": [
                { "box_id": null, "property": "X", "kind": "sense" }
              ],
              "human_b": [
                { "box_id": null, "property": "Y", "kind": "sense" }
              ],
              "other_humans": []
            },
            "certainty": 0.9,
            "natural_summary": "The human is proposing that Human A handle X boxes, Human B handle Y boxes, and the robot should sense Y on box 3."
          }

        Example 3:

          Utterance: "What are you doing right now?"
          =>
          {
            "is_command": false,
            "command_type": "non_command",
            "agents_plan": null,
            "certainty": 0.98,
            "natural_summary": "The human is asking about the robot's current activity, not giving a command."
          }

      output_schema: |
        {
          "type": "object",
          "required": [
            "is_command",
            "command_type",
            "agents_plan",
            "certainty",
            "natural_summary"
          ],
          "properties": {
            "is_command": {
              "type": "boolean"
            },
            "command_type": {
              "type": "string",
              "enum": ["robot_only", "multi_agent_plan", "non_command", "ambiguous"]
            },
            "agents_plan": {
              "type": ["object", "null"],
              "properties": {
                "robot": {
                  "type": "array",
                  "items": {
                    "type": "object",
                    "required": ["box_id", "property", "kind"],
                    "properties": {
                      "box_id":   { "type": ["integer", "null"] },
                      "property": {
                        "type": ["string", "null"],
                        "enum": ["X", "Y", null]
                      },
                      "kind": {
                        "type": "string",
                        "enum": ["sense", "dispose"]
                      }
                    }
                  }
                },
                "human_a": {
                  "type": "array",
                  "items": {
                    "type": "object",
                    "required": ["box_id", "property", "kind"],
                    "properties": {
                      "box_id":   { "type": ["integer", "null"] },
                      "property": {
                        "type": ["string", "null"],
                        "enum": ["X", "Y", null]
                      },
                      "kind": {
                        "type": "string",
                        "enum": ["sense", "dispose"]
                      }
                    }
                  }
                },
                "human_b": {
                  "type": "array",
                  "items": {
                    "type": "object",
                    "required": ["box_id", "property", "kind"],
                    "properties": {
                      "box_id":   { "type": ["integer", "null"] },
                      "property": {
                        "type": ["string", "null"],
                        "enum": ["X", "Y", null]
                      },
                      "kind": {
                        "type": "string",
                        "enum": ["sense", "dispose"]
                      }
                    }
                  }
                },
                "other_humans": {
                  "type": "array",
                  "items": {
                    "type": "object",
                    "required": ["box_id", "property", "kind"],
                    "properties": {
                      "box_id":   { "type": ["integer", "null"] },
                      "property": {
                        "type": ["string", "null"],
                        "enum": ["X", "Y", null]
                      },
                      "kind": {
                        "type": "string",
                        "enum": ["sense", "dispose"]
                      }
                    }
                  }
                }
              },
              "additionalProperties": false
            },
            "certainty": {
              "type": "number"
            },
            "natural_summary": {
              "type": "string"
            }
          }
        }




