version: 2

defaults:
  window_ms: 3000

skills:
  # ─────────────────────────────
  # PRIMITIVES
  # ─────────────────────────────

  - name: tts.say
    kind: primitive
    description: "Speak a short text utterance using the TTS pipeline."
    action: tts
    params:
      text: "{{ctx.text | default:'OK'}}"

  - name: gesture.greet
    kind: primitive
    description: "Perform a simple greeting gesture toward nearby humans."
    action: gesture
    params:
      kind: "greet"

  - name: nav.move_relative
    kind: primitive
    description: "Move the base by a relative azimuth (deg) and distance (m) from the current pose."
    action: move_relative
    params:
      azimuth_deg: "{{ctx.azimuth_deg | default:0}}"
      dist_m: "{{ctx.dist_m | default:0.6}}"

  - name: nav.move_absolute
    kind: primitive
    description: "Move the base to an absolute pose (x,y,yaw) in a given frame (usually 'map')."
    action: move_absolute
    params:
      frame: "{{ctx.frame | default:'map'}}"
      x: "{{ctx.x | default:0}}"
      y: "{{ctx.y | default:0}}"
      yaw: "{{ctx.yaw | default:0}}"

  - name: db.query_top_beacons
    kind: primitive
    description: "Ask the broker/DB for the top-N strongest beacons and store the result in ctx."
    action: query_beacons
    params:
      top_n: "{{ctx.top_n | default:3}}"

  - name: llm.check_speech
    kind: primitive
    description: "Send the latest utterance to the LLM speech-check microservice for intent/labeling."
    action: llm_speech_check
    params:
      prompt: "{{ctx.prompt | default:''}}"
      output_schema: "{{ctx.output_schema | default:''}}"
      text: "{{ctx.text | default:''}}"
      tag: "{{ctx.tag | default:'default_speech_check'}}"

  - name: vlm.run_query
    kind: primitive
    description: "Send a prompt about the current camera frame to the VLM microservice."
    action: vlm_inference
    params:
      prompt: "{{ctx.prompt | default:''}}"
      output_schema: "{{ctx.output_schema | default:''}}"
      tag: "{{ctx.tag | default:'default_vlm'}}"
      mode: "{{ctx.mode | default:'generic'}}"

  - name: explore.coverage_wait
    kind: primitive
    description: "Visit closest unvisited free-space points and dwell at each; resumes after interruption."
    action: coverage_wait
    params: {}


  # ─────────────────────────────
  # STATE MACHINES (COMPOSITES)
  # ─────────────────────────────

  # Turn search: rotate incrementally left and right using nav.move_relative
  # until either a presence is detected or the user interrupts (speech_final_any).
  - name: base.turn_search
    kind: state_machine
    description: "Sweep left in place to visually search for humans or new stimuli."
    when: {}
    until:
      any:
        - exists: human_detected_3d
    initial_state: turn_left_1
    states:
      - id: turn_left_1
        type: action
        action:
          use: nav.move_relative
          with:
            azimuth_deg: 45.0
            dist_m: 0.0
        on_complete: turn_left_2

      - id: turn_left_2
        type: action
        action:
          use: nav.move_relative
          with:
            azimuth_deg: 45.0
            dist_m: 0.0
        on_complete: turn_left_3

      - id: turn_left_3
        type: action
        action:
          use: nav.move_relative
          with:
            azimuth_deg: 45.0
            dist_m: 0.0
        on_complete: turn_left_4
        
      - id: turn_left_4
        type: action
        action:
          use: nav.move_relative
          with:
            azimuth_deg: 45.0
            dist_m: 0.0
        on_complete: turn_left_5
        
      - id: turn_left_5
        type: action
        action:
          use: nav.move_relative
          with:
            azimuth_deg: 45.0
            dist_m: 0.0
        on_complete: turn_left_6
        
      - id: turn_left_6
        type: action
        action:
          use: nav.move_relative
          with:
            azimuth_deg: 45.0
            dist_m: 0.0
        on_complete: turn_left_7
        
      - id: turn_left_7
        type: action
        action:
          use: nav.move_relative
          with:
            azimuth_deg: 45.0
            dist_m: 0.0
        on_complete: turn_left_8
        
      - id: turn_left_8
        type: action
        action:
          use: nav.move_relative
          with:
            azimuth_deg: 45.0
            dist_m: 0.0
        on_complete: null


  # Greet with presence; only speak if the person actually engages.
  - name: greet.with_presence
    kind: state_machine
    description: "Wave to a detected human and offer help if they respond within a short window."
    when: {}
    until: {}
    initial_state: greet
    states:
      - id: greet
        type: action
        action:
          use: gesture.greet
          with: {}
        on_complete: wait_for_engagement

      - id: wait_for_engagement
        type: wait
        wait_for:
          any_of:
            - rule_id: speech_final_any
              within_ms: 3000
            - rule_id: speech_keyword
              within_ms: 3000
        on_event: say_help
        on_timeout: null   # if no engagement, just end

      - id: say_help
        type: action
        action:
          use: tts.say
          with:
            text: "Hi! How can I help?"
        on_complete: null




  - name: sense.here
    kind: state_machine
    description: "Sense for objects in the location where the robot is currently in."
    when: {}
    until: {}
    initial_state: wait_only
    states:
      - id: wait_only
        type: wait
        wait_for:
          any_of:
            - rule_id: "sense_dummy"
              within_ms: 5000
        on_event: null
        on_timeout: null


  # ─────────────────────────────
  # NEW SHORT-TERM / REACTIVE SKILLS
  # ─────────────────────────────

  - name: beacons.announce_strongest_here
    kind: state_machine
    description: "Announce the strongest beacon just observed by the BT proximity task."
    when: {}
    until: {}
    initial_state: say_beacon
    states:
      - id: say_beacon
        type: action
        action:
          use: tts.say
          with:
            text: 
              "I’m sensing a strong beacon here,
              object {{ rule.bt_rssi_seen.object_id | default:'unknown' }} with RSSI
              {{ rule.bt_rssi_seen.rssi | default:'-inf' }}."
        on_complete: null


  - name: beacons.report_topn
    kind: state_machine
    description: "Query and report the top-N strongest beacons using DB-backed state."
    when: {}
    until: {}
    initial_state: query_db
    states:
      - id: query_db
        type: action
        action:
          use: db.query_top_beacons
          with:
            top_n: "{{ ctx.top_n | default:3 }}"
        on_complete: speak

      - id: speak
        type: action
        action:
          use: tts.say
          with:
            text: "{{ ctx.last_query_beacons_speech | default:'I checked the nearby beacons.' }}"
        on_complete: null


  - name: vlm.look_and_describe
    kind: state_machine
    description: "Run a VLM query on the current scene and verbally describe what it sees."
    when: {}
    until: {}
    initial_state: ask_vlm
    states:
      - id: ask_vlm
        type: action
        action:
          use: vlm.run_query
          with:
            prompt: "{{ ctx.prompt | default:'Describe what you see in front of me.' }}"
            output_schema: "{{ ctx.output_schema | default:'' }}"
            tag: "{{ ctx.tag | default:'scene_describe' }}"
            mode: "{{ ctx.mode | default:'generic' }}"
        on_complete: say_scene

      - id: say_scene
        type: action
        action:
          use: tts.say
          with:
            text: 
              "{{ ctx.vlm.raw_text | default:'I could not interpret the scene.' }}"
        on_complete: null


  - name: nav.turn_to_speaker
    kind: state_machine
    description: "Use the generic turn search behavior to look for a human."
    when: {}
    until: {}
    initial_state: search
    states:
      - id: search
        type: action
        action:
          use: base.turn_search
          with: {}
        on_complete: null


