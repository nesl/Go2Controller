# skills.v2.yaml
# Composite- and step-level `when` / `until` supported.
# No base.search_person or new base primitives.
# turn_search built from small relative movements (nav.move_relative).

version: 2

defaults:
  window_ms: 3000

skills:
  # ─────────────────────────────
  # PRIMITIVES
  # ─────────────────────────────

  - name: tts.say
    kind: primitive
    action: tts
    params:
      text: "{{ctx.text | default:'OK'}}"

  - name: gesture.greet
    kind: primitive
    action: gesture
    params:
      kind: "greet"

  - name: nav.move_relative
    kind: primitive
    action: move_relative
    params:
      azimuth_deg: "{{ctx.azimuth_deg | default:0}}"
      dist_m: "{{ctx.dist_m | default:0.6}}"

  - name: nav.move_absolute
    kind: primitive
    action: move_absolute
    params:
      frame: "{{ctx.frame | default:'map'}}"
      x: "{{ctx.x | default:0}}"
      y: "{{ctx.y | default:0}}"
      yaw: "{{ctx.yaw | default:0}}"

  - name: db.query_top_beacons
    kind: primitive
    action: query_beacons
    params:
      top_n: "{{ctx.top_n | default:3}}"

  - name: llm.check_speech
    kind: primitive
    action: llm_speech_check
    params:
      prompt: "{{ctx.prompt | default:''}}"
      output_schema: "{{ctx.output_schema | default:''}}"
      text: "{{ctx.text | default:''}}"
      tag: "{{ctx.tag | default:'default_speech_check'}}"


  - name: vlm.run_query
    kind: primitive
    action: vlm_inference
    params:
      prompt: "{{ctx.prompt | default:''}}"
      output_schema: "{{ctx.output_schema | default:''}}"   # optional but nice symmetry
      tag: "{{ctx.tag | default:'default_vlm'}}"
      # you can keep 'mode' if you want, but it’s just metadata now
      mode: "{{ctx.mode | default:'generic'}}"



  # ─────────────────────────────
  # STATE MACHINES (was: COMPOSITES)
  # ─────────────────────────────

  # Turn search: rotate incrementally left and right using nav.move_relative
  # until either a presence is detected or the user interrupts (speech_final_any).
  - name: base.turn_search
    kind: state_machine
    when: {}
    until:
      any:
        - exists: human_detected_3d
        - exists: speech_final_any
          within_ms: 1
    initial_state: turn_left_1
    states:
      - id: turn_left_1
        type: action
        action:
          use: nav.move_relative
          with:
            azimuth_deg: 45.0
            dist_m: 0.0
        on_complete: turn_right

      - id: turn_right
        type: action
        action:
          use: nav.move_relative
          with:
            azimuth_deg: -90.0
            dist_m: 0.0
        on_complete: turn_left_2

      - id: turn_left_2
        type: action
        action:
          use: nav.move_relative
          with:
            azimuth_deg: 45.0
            dist_m: 0.0
        on_complete: null   # no next state -> finish


  # Greet with presence; only speak if the person actually engages.
  - name: greet.with_presence
    kind: state_machine
    when:
      all:
        - exists: pose_present_precise
          within_ms: 2500
        - exists: speech_keyword
          within_ms: 2500
    until: {}
    initial_state: greet
    states:
      - id: greet
        type: action
        action:
          use: gesture.greet
          with: {}
        on_complete: wait_for_engagement

      - id: wait_for_engagement
        type: wait
        wait_for:
          any_of:
            - rule_id: speech_final_any
              within_ms: 3000
            - rule_id: speech_keyword
              within_ms: 3000
        on_event: say_help
        on_timeout: null   # if no engagement, just end

      - id: say_help
        type: action
        action:
          use: tts.say
          with:
            text: "Hi! How can I help?"
        on_complete: null


  # Beacon report: query DB then speak summary.
  - name: beacons.report_top3
    kind: state_machine
    when:
      any:
        - exists: speech_keyword
          within_ms: 5000
        - exists: speech_final_any
          within_ms: 5000
    until:
      exists: speech_final_any
      within_ms: 1
    initial_state: query_db
    states:
      - id: query_db
        type: action
        action:
          use: db.query_top_beacons
          with:
            top_n: 3
        on_complete: speak

      - id: speak
        type: action
        action:
          use: tts.say
          with:
            text: "{{ctx.last_query_beacons_speech | default:'Beacon report complete.'}}"
        on_complete: null



